<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="30" cy="30" r="28" fill="none" stroke="url(#lg1)" stroke-width="2.5"/>
  <circle cx="30" cy="30" r="22" fill="url(#lg1)" opacity="0.15"/>
  <!-- 内部箭头/人形图标 -->
  <path d="M22 38 L30 20 L38 38" fill="none" stroke="url(#lg1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="17" r="4" fill="url(#lg1)"/>
  <!-- 文字 -->
  <text x="62" y="33" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="url(#lg1)">成长之路</text>
  <text x="62" y="50" font-family="'Segoe UI',sans-serif" font-size="11" fill="#6b7294" letter-spacing="2">GROWTH JOURNEY</text>
</svg>
