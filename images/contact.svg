<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cbg)"/>
  <circle cx="200" cy="200" r="180" fill="#7b2ff7" opacity="0.05"/>
  <circle cx="600" cy="400" r="150" fill="#ff6b6b" opacity="0.05"/>
  <!-- 联系图标装饰 -->
  <g fill="#fff" opacity="0.06">
    <rect x="320" y="200" width="160" height="40" rx="20" stroke="#00d4ff" stroke-width="1" fill="none"/>
    <rect x="340" y="260" width="120" height="40" rx="20" stroke="#7b2ff7" stroke-width="1" fill="none"/>
    <rect x="360" y="320" width="80" height="40" rx="20" stroke="#ff6b6b" stroke-width="1" fill="none"/>
  </g>
  <text x="400" y="460" font-family="'Microsoft YaHei',sans-serif" font-size="36" fill="#fff" text-anchor="middle" font-weight="bold">联系我们</text>
  <text x="400" y="500" font-family="'Microsoft YaHei',sans-serif" font-size="16" fill="#b0b8d1" text-anchor="middle">期待与您的交流与合作</text>
  <!-- 虚线连接 -->
  <g stroke="#fff" stroke-width="1" stroke-dasharray="4,4" opacity="0.05">
    <line x1="400" y1="240" x2="400" y2="420"/>
  </g>
</svg>
